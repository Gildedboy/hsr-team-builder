name: Automation Weekly Regression

on:
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-weekly-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-regression:
    # Keep browser dependencies stable when ubuntu-latest moves to a newer OS.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/automation/package-lock.json
      - run: npm ci
        working-directory: tests/automation
      - run: npx playwright install --with-deps chromium
        working-directory: tests/automation
      - run: npm run test
        working-directory: tests/automation
        env:
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL || 'https://hsr-team-builder.gilded.dev' }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://api.hsr-team-builder.gilded.dev' }}
          TEST_ENV: weekly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: automation-weekly-regression-report
          path: |
            tests/automation/playwright-report
            tests/automation/test-results
          if-no-files-found: ignore
