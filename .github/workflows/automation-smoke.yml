name: Automation Smoke

on:
  pull_request:
    paths:
      - 'packages/frontend/**'
      - 'packages/shared/**'
      - 'tests/automation/**'
      - '.github/workflows/automation-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Keep browser dependencies on an OS supported by the locked Playwright version.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/automation/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: tests/automation
      - run: npx playwright install --with-deps chromium
        working-directory: tests/automation
      - run: npm run typecheck
        working-directory: tests/automation
      - run: npm run lint
        working-directory: tests/automation
      - run: npm run build -w @hsr-team-builder/shared
      - run: npm run build:frontend
      - name: Start frontend preview
        run: |
          npm run preview -w @hsr-team-builder/frontend -- --host 127.0.0.1 > /tmp/hsr-frontend-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hsr-frontend-preview.log
          exit 1
      - run: npm run test:smoke
        working-directory: tests/automation
        env:
          FRONTEND_BASE_URL: http://localhost:4173
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: automation-smoke-artifacts
          path: |
            tests/automation/playwright-report
            tests/automation/test-results
          if-no-files-found: ignore
